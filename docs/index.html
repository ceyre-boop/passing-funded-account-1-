<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STOCKFISH × ALPHAZERO — Funded Account Desk</title>
<style>
  :root {
    --bg: #07090c; --panel: #0d1117; --line: #1c2530; --line-hi: #2b3a4d;
    --green: #3fdc97; --amber: #e8b44a; --red: #e5534b; --blue: #58a6ff;
    --text: #c9d4e0; --muted: #5b6b7d;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: rgba(63,220,151,.35); }
  html { background: var(--bg); }
  body {
    color: var(--text); background: var(--bg);
    font: 15px/1.55 -apple-system, "Inter", "Segoe UI", sans-serif;
    border-top: 2px solid transparent;
    border-image: linear-gradient(90deg, var(--green), var(--blue)) 1;
    padding-bottom: 48px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px 20px; transition: border-color 150ms;
  }
  .card:hover { border-color: var(--line-hi); }
  .s12 { grid-column: span 12; } .s6 { grid-column: span 6; }
  .s4 { grid-column: span 4; } .s8 { grid-column: span 8; }
  @media (max-width: 760px) { .s6, .s4, .s8 { grid-column: span 12; } }

  .label {
    font: 600 11px/1 var(--mono); text-transform: uppercase;
    letter-spacing: .14em; color: var(--muted); margin-bottom: 12px;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .big { font: 700 clamp(1.6rem, 4vw, 2.6rem)/1.1 var(--mono);
         letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .green { color: var(--green); } .amber { color: var(--amber); }
  .red { color: var(--red); } .blue { color: var(--blue); }

  /* hero */
  header {
    padding: 44px 0 30px;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.012) 2px 4px);
    border-bottom: 1px solid var(--line); margin-bottom: 24px;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start;
              gap: 20px; flex-wrap: wrap; }
  h1 { font: 800 clamp(1.7rem, 5vw, 3rem)/1.05 var(--mono);
       letter-spacing: -0.03em; }
  .subtitle { color: var(--muted); font-family: var(--mono); font-size: 13px;
              margin-top: 8px; letter-spacing: .04em; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-hi); border-radius: 20px;
    padding: 7px 15px; font: 600 12px var(--mono); letter-spacing: .08em;
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
         animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,220,151,.5); }
    50% { box-shadow: 0 0 0 7px rgba(63,220,151,0); }
  }
  .statstrip { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 28px; }
  .stat { flex: 1 1 190px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 6px; padding: 14px 18px; }
  .stat .v { font: 700 clamp(1.5rem, 3.5vw, 2.1rem)/1.15 var(--mono);
             font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .stat .k { font: 600 10px var(--mono); letter-spacing: .12em;
             text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  /* pills / badges */
  .pill { display: inline-block; border-radius: 4px; padding: 3px 10px;
          font: 700 12px var(--mono); letter-spacing: .06em; border: 1px solid; }
  .pill.abstain { color: var(--amber); border-color: rgba(232,180,74,.45);
                  background: rgba(232,180,74,.10); }
  .pill.allow  { color: var(--green); border-color: rgba(63,220,151,.45);
                 background: rgba(63,220,151,.10); }
  .pill.tighten{ color: var(--blue); border-color: rgba(88,166,255,.45);
                 background: rgba(88,166,255,.10); }
  .pill.exit   { color: var(--red); border-color: rgba(229,83,75,.45);
                 background: rgba(229,83,75,.10); }
  .chiplet { display: inline-block; font: 600 10px var(--mono); color: var(--muted);
             border: 1px solid var(--line); border-radius: 3px;
             padding: 2px 6px; margin: 2px 3px 0 0; letter-spacing: .05em; }
  .chiplet.m { color: var(--green); border-color: rgba(63,220,151,.3); }

  /* both sides */
  .triptych { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
              margin-top: 12px; }
  @media (max-width: 760px) { .triptych { grid-template-columns: 1fr; } }
  .side { border-radius: 5px; padding: 12px 14px; font-size: 13.5px;
          border: 1px solid var(--line); }
  .side h4 { font: 700 10px var(--mono); letter-spacing: .14em;
             text-transform: uppercase; margin-bottom: 7px; }
  .side.bull { border-left: 3px solid var(--green); }
  .side.base { border-left: 3px solid var(--muted); }
  .side.bear { border-left: 3px solid var(--red); }

  ul.inv { list-style: none; margin-top: 8px; }
  ul.inv li { padding: 5px 0 5px 22px; position: relative; font-size: 13.5px;
              border-bottom: 1px dashed var(--line); }
  ul.inv li:last-child { border-bottom: 0; }
  ul.inv li::before { content: "◇"; position: absolute; left: 2px;
                      color: var(--amber); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { font: 600 10px var(--mono); text-transform: uppercase; letter-spacing: .12em;
       color: var(--muted); text-align: left; padding: 8px 10px;
       border-bottom: 1px solid var(--line); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line);
       font-family: var(--mono); font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  tr.hi td { background: rgba(63,220,151,.05); }
  td.r { text-align: right; }

  .meter { height: 10px; background: #131a22; border-radius: 5px;
           overflow: hidden; margin: 8px 0 4px; }
  .meter > div { height: 100%; background: var(--green); border-radius: 5px;
                 box-shadow: 0 0 8px rgba(63,220,151,.4); }

  .stale { display: inline-block; font: 700 9px var(--mono); letter-spacing: .1em;
           color: var(--amber); border: 1px solid rgba(232,180,74,.5);
           background: rgba(232,180,74,.10); border-radius: 3px;
           padding: 2px 6px; margin-left: 8px; vertical-align: middle; }
  .fresh { display: inline-block; font: 700 9px var(--mono); letter-spacing: .1em;
           color: var(--muted); margin-left: 8px; vertical-align: middle; }
  .empty { border: 1px dashed var(--line-hi); border-radius: 6px;
           padding: 22px; text-align: center; color: var(--muted);
           font-family: var(--mono); font-size: 13px; }

  .killgrid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 6px;
              margin-top: 8px; }
  .kill { aspect-ratio: 1; border-radius: 3px; background: rgba(63,220,151,.16);
          border: 1px solid rgba(63,220,151,.5); position: relative;
          display: flex; align-items: center; justify-content: center;
          font: 600 8.5px var(--mono); color: var(--green); cursor: default; }
  .kill.flag { border-color: var(--amber); }
  .kill:hover::after {
    content: attr(data-tip); position: absolute; bottom: 120%; left: 50%;
    transform: translateX(-50%); background: #131a22; color: var(--text);
    border: 1px solid var(--line-hi); border-radius: 4px; padding: 6px 10px;
    font: 400 11px/1.4 var(--mono); white-space: normal; width: 210px;
    z-index: 5; text-align: left;
  }

  .gates { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .gate { flex: 1 1 130px; border-radius: 5px; padding: 9px 11px;
          font: 600 11px var(--mono); border: 1px solid var(--line-hi);
          color: var(--muted); }
  .gate.done { border-color: rgba(63,220,151,.5); color: var(--green);
               background: rgba(63,220,151,.07); }
  .gate.part { border-color: rgba(88,166,255,.5); color: var(--blue);
               background: rgba(88,166,255,.07); }
  .gate small { display: block; font-weight: 400; color: var(--muted);
                margin-top: 2px; font-size: 10px; }

  .disc { border-left: 3px solid var(--green); }
  .disc h3 { font: 700 14px var(--mono); margin-bottom: 6px; }
  .disc p { font-size: 12.5px; color: var(--text); opacity: .85; line-height: 1.5; }
  .disc .status { float: right; }
  .pill.on { color: var(--green); border-color: rgba(63,220,151,.45);
             background: rgba(63,220,151,.10); }
  .pill.armed { color: var(--amber); border-color: rgba(232,180,74,.45);
                background: rgba(232,180,74,.10); }

  .sec { margin: 26px 0 12px; font: 700 13px var(--mono); letter-spacing: .16em;
         text-transform: uppercase; color: var(--muted); }
  .sec::before { content: "// "; color: var(--green); }
  footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
           font: 12px var(--mono); color: var(--muted); line-height: 1.8; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  svg text { font-family: var(--mono); }
  .prooofline { font: 11px var(--mono); color: var(--muted); margin-top: 12px;
                border-top: 1px dashed var(--line); padding-top: 10px; }
  #err { display: none; margin: 40px auto; max-width: 600px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hero-top">
      <div>
        <h1>PASSING A FUNDED ACCOUNT</h1>
        <div class="subtitle">STOCKFISH × ALPHAZERO — mechanics decide, meaning advises</div>
      </div>
      <div style="text-align:right">
        <span class="chip"><span class="dot" id="modeDot"></span><span id="modeChip">LOADING…</span></span>
        <div class="muted mono" style="font-size:11px;margin-top:8px" id="lastTs"></div>
      </div>
    </div>
    <div class="statstrip" id="statstrip"></div>
  </div>
</header>

<div class="wrap">
  <div class="card empty" id="err">failed to load data.json — the generator has not published yet</div>

  <div class="sec">AlphaZero — every prediction, and what the tape did</div>
  <div class="grid">
    <div class="card s4" id="azScore"></div>
    <div class="card s8" id="azTable"></div>
  </div>

  <div class="sec">Stockfish — exit quality, judged by lookback</div>
  <div class="grid">
    <div class="card s4" id="sfScore"></div>
    <div class="card s8" id="sfTable"></div>
  </div>

  <div class="sec">Latest sealed judgment</div>
  <div class="grid">
    <div class="card s12" id="judgmentCard"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const fmtTs = iso => iso ? iso.replace("T", " ").slice(0, 16) + " UTC" : "—";
const VP = { ABSTAIN: "abstain", ALLOW_BASELINE: "allow", TIGHTEN: "tighten", EXIT: "exit" };
function ageBadge(o) {
  const b = el("span", o.stale ? "stale" : "fresh",
    o.age_hours === null || o.age_hours === undefined ? "AGE UNKNOWN"
      : o.stale ? `STALE ${o.age_hours}h` : `fresh ${o.age_hours}h`);
  return b;
}

function stat(value, key, cls) {
  const s = el("div", "stat");
  s.appendChild(el("div", "v " + (cls || ""), value));
  s.appendChild(el("div", "k", key));
  return s;
}

function donutSVG(counts) {
  const colors = { ABSTAIN: "#e8b44a", ALLOW_BASELINE: "#3fdc97",
                   TIGHTEN: "#58a6ff", EXIT: "#e5534b" };
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 120 120");
  svg.setAttribute("width", "130"); svg.setAttribute("height", "130");
  const C = 2 * Math.PI * 44;
  let off = 0;
  for (const [k, n] of Object.entries(counts)) {
    if (!n) continue;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", 60); c.setAttribute("cy", 60); c.setAttribute("r", 44);
    c.setAttribute("fill", "none"); c.setAttribute("stroke", colors[k]);
    c.setAttribute("stroke-width", "11");
    c.setAttribute("stroke-dasharray", `${C * n / total - 2} ${C - C * n / total + 2}`);
    c.setAttribute("stroke-dashoffset", String(-off + C / 4));
    c.setAttribute("opacity", "0.9");
    off += C * n / total;
    svg.appendChild(c);
  }
  const t = document.createElementNS(NS, "text");
  t.setAttribute("x", 60); t.setAttribute("y", 58); t.setAttribute("text-anchor", "middle");
  t.setAttribute("fill", "#c9d4e0"); t.setAttribute("font-size", "22");
  t.setAttribute("font-weight", "700"); t.textContent = String(total);
  const t2 = document.createElementNS(NS, "text");
  t2.setAttribute("x", 60); t2.setAttribute("y", 74); t2.setAttribute("text-anchor", "middle");
  t2.setAttribute("fill", "#5b6b7d"); t2.setAttribute("font-size", "9");
  t2.textContent = "JUDGMENTS";
  svg.appendChild(t); svg.appendChild(t2);
  return svg;
}

function sparkSVG(rows) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 300 90"); svg.setAttribute("width", "100%");
  const ys = rows.map(r => r.yield_delta_r);
  const min = Math.min(...ys, 0), max = Math.max(...ys, 0);
  const X = i => 10 + i * 280 / Math.max(rows.length - 1, 1);
  const Y = v => 78 - (v - min) / (max - min || 1) * 66;
  const zero = document.createElementNS(NS, "line");
  zero.setAttribute("x1", 10); zero.setAttribute("x2", 290);
  zero.setAttribute("y1", Y(0)); zero.setAttribute("y2", Y(0));
  zero.setAttribute("stroke", "#1c2530"); zero.setAttribute("stroke-dasharray", "3 3");
  svg.appendChild(zero);
  const p = document.createElementNS(NS, "polyline");
  p.setAttribute("points", rows.map((r, i) => `${X(i)},${Y(r.yield_delta_r)}`).join(" "));
  p.setAttribute("fill", "none"); p.setAttribute("stroke", "#3fdc97");
  p.setAttribute("stroke-width", "1.5");
  p.setAttribute("filter", "drop-shadow(0 0 4px rgba(63,220,151,.35))");
  svg.appendChild(p);
  rows.forEach((r, i) => {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", X(i)); c.setAttribute("cy", Y(r.yield_delta_r));
    c.setAttribute("r", 2.5); c.setAttribute("fill", "#3fdc97");
    svg.appendChild(c);
  });
  return svg;
}

function bandSVG(lo, hi) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 300 44"); svg.setAttribute("width", "100%");
  const X = v => 10 + (v + 5) * 28;   // [-5,+5] -> [10,290]
  const axis = document.createElementNS(NS, "line");
  axis.setAttribute("x1", 10); axis.setAttribute("x2", 290);
  axis.setAttribute("y1", 22); axis.setAttribute("y2", 22);
  axis.setAttribute("stroke", "#1c2530"); axis.setAttribute("stroke-width", "2");
  svg.appendChild(axis);
  [-5, 0, 5].forEach(v => {
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", X(v)); t.setAttribute("y", 40);
    t.setAttribute("text-anchor", "middle"); t.setAttribute("fill", "#5b6b7d");
    t.setAttribute("font-size", "9"); t.textContent = (v > 0 ? "+" : "") + v + "R";
    svg.appendChild(t);
  });
  const band = document.createElementNS(NS, "rect");
  band.setAttribute("x", X(lo)); band.setAttribute("y", 14);
  band.setAttribute("width", Math.max(X(hi) - X(lo), 2)); band.setAttribute("height", 16);
  band.setAttribute("rx", 3); band.setAttribute("fill", "rgba(63,220,151,.25)");
  band.setAttribute("stroke", "#3fdc97"); band.setAttribute("stroke-width", "1.5");
  svg.appendChild(band);
  return svg;
}

function render(d) {
  const s = d.session, c = d.containment, az = d.alphazero, sf = d.stockfish;
  $("modeChip").textContent = s.mode + (s.symbol ? " · " + s.symbol : "");
  $("modeDot").style.background = s.shadow ? "#3fdc97" : "#58a6ff";
  $("lastTs").textContent = "last record " + fmtTs(s.last_record_ts);

  // hero: performance, not infrastructure
  const strip = $("statstrip");
  const accTxt = az.direction_accuracy === null ? "—"
        : `${(az.direction_accuracy * 100).toFixed(0)}%`;
  strip.appendChild(stat(accTxt, `AZ direction (n=${az.n_resolved})`,
                         az.n_resolved < 30 ? "amber" : ""));
  strip.appendChild(stat(sf.available ? sf.median_efficiency.toFixed(2) : "—",
                         "SF exit efficiency", "green"));
  strip.appendChild(stat(sf.available ? `${sf.pct_unwinnable}%` : "—",
                         "entries no exit could win", "red"));
  strip.appendChild(stat(String(c.directives_emitted), "directives emitted",
                         c.clean ? "green" : "red"));

  // ---------------- AlphaZero scoreboard ----------------
  const a = $("azScore");
  const azLab = el("div", "label", "Accuracy vs chance");
  azLab.appendChild(ageBadge(az));
  a.appendChild(azLab);
  a.appendChild(el("div", "big " + (az.n_resolved < 30 ? "amber" : ""), accTxt));
  a.appendChild(el("div", "mono muted",
    `direction: ${az.direction_hits}/${az.n_resolved} resolved`)).style.fontSize = "11px";
  const sc = el("div", "mono");
  sc.style.marginTop = "10px";
  sc.appendChild(el("div", "", `scenario: ${az.scenario_hits}/${az.n_resolved} ` +
    `(${(az.scenario_accuracy * 100).toFixed(0)}% vs ${az.chance_scenario * 100}% chance)`));
  sc.appendChild(el("div", "muted", `abstained on ${(az.abstain_rate * 100).toFixed(0)}% of resolved calls`));
  sc.appendChild(el("div", "muted", `${az.n_decisive_resolved} decisive · need ${az.min_n_for_quotable}`));
  a.appendChild(sc);
  if (!az.decisive_accuracy_quotable) {
    const w = el("div", "empty",
      `n=${az.n_decisive_resolved} decisive calls — below the ${az.min_n_for_quotable} ` +
      `needed before any accuracy number is quotable. Read the rows, not the rate.`);
    w.style.marginTop = "12px";
    a.appendChild(w);
  }

  const at = $("azTable");
  at.appendChild(el("div", "label", "Every prediction (newest last)"));
  if (!az.predictions.length) {
    at.appendChild(el("div", "empty", "no predictions yet"));
  } else {
    const tb = el("table"), hd = el("tr");
    ["when", "verdict", "said", "tape did", "hit", "conf", "exp R"].forEach(h =>
      hd.appendChild(el("th", "", h)));
    tb.appendChild(hd);
    az.predictions.forEach(p => {
      const tr = el("tr");
      tr.appendChild(el("td", "muted", fmtTs(p.as_of).slice(5, 16)));
      tr.appendChild(el("td", "", p.verdict || "—"));
      tr.appendChild(el("td", "", `${p.predicted_direction} / ${p.predicted_scenario.replace(/_/g, " ")}`));
      tr.appendChild(el("td", "muted", !p.resolved ? "open" :
        `${p.outcome_direction} / ${p.outcome_scenario.replace(/_/g, " ")}`));
      const hit = el("td", "", !p.resolved ? "—" : p.direction_hit ? "✓" : "✗");
      hit.className = "td " + (!p.resolved ? "muted" : p.direction_hit ? "green" : "red");
      tr.appendChild(hit);
      tr.appendChild(el("td", "muted", (p.confidence ?? 0).toFixed(2)));
      tr.appendChild(el("td", "muted", p.expected_r[0] === null ? "—" :
        `${p.expected_r[0]} → ${p.expected_r[1]}`));
      tb.appendChild(tr);
    });
    at.appendChild(tb);
  }

  // ---------------- Stockfish scoreboard ----------------
  const sfs = $("sfScore");
  const sfLab = el("div", "label", "Kept vs reachable");
  if (sf.available) sfLab.appendChild(ageBadge(sf));
  sfs.appendChild(sfLab);
  if (!sf.available) {
    sfs.appendChild(el("div", "empty", "no exit-quality report yet"));
  } else {
    sfs.appendChild(el("div", "big green", sf.median_efficiency.toFixed(2)));
    sfs.appendChild(el("div", "mono muted",
      "median share of the best reachable exit")).style.fontSize = "11px";
    const g = el("div", "mono");
    g.style.marginTop = "10px";
    g.appendChild(el("div", "", `median giveback: ${sf.median_giveback_r} R`));
    g.appendChild(el("div", "muted",
      `mean realized ${sf.mean_realized_r >= 0 ? "+" : ""}${sf.mean_realized_r} R`));
    g.appendChild(el("div", "muted",
      `vs hindsight oracle ${sf.mean_oracle_r >= 0 ? "+" : ""}${sf.mean_oracle_r} R`));
    g.appendChild(el("div", "red", `${sf.pct_unwinnable}% of entries: NO exit could win`));
    sfs.appendChild(g);
    const warn = el("div", "prooofline", sf.hindsight_warning);
    sfs.appendChild(warn);
  }

  const sft = $("sfTable");
  sft.appendChild(el("div", "label", "By asset class · " + (sf.available ? sf.n_sessions : 0) + " sessions"));
  if (sf.available) {
    const tb = el("table"), hd = el("tr");
    ["class", "n", "efficiency", "giveback R", "mean realized", "unwinnable"].forEach(h =>
      hd.appendChild(el("th", "", h)));
    tb.appendChild(hd);
    Object.entries(sf.by_class).forEach(([cls, v]) => {
      const tr = el("tr");
      tr.appendChild(el("td", "", cls));
      tr.appendChild(el("td", "muted", String(v.n)));
      const e = el("td", "", v.median_efficiency.toFixed(3));
      e.className = "td " + (v.median_efficiency > 0.7 ? "green" : v.median_efficiency < 0.5 ? "red" : "amber");
      tr.appendChild(e);
      tr.appendChild(el("td", "muted", String(v.median_giveback_r)));
      const mr = el("td", "r " + (v.mean_realized_r > 0 ? "green" : "red"),
                    (v.mean_realized_r >= 0 ? "+" : "") + v.mean_realized_r);
      tr.appendChild(mr);
      tr.appendChild(el("td", "red", v.pct_unwinnable + "%"));
      tb.appendChild(tr);
    });
    sft.appendChild(tb);
    sft.appendChild(el("div", "prooofline",
      "efficiency = realized / best-in-vocabulary (hindsight). Giveback = max " +
      "favorable excursion the position reached, minus what it kept. " +
      "'Unwinnable' means no configuration in the entire exit vocabulary " +
      "finished that session positive — an ENTRY failure the exit cannot fix."));
  }

  // ---------------- latest judgment (kept, compact) ----------------
  const j = d.latest_judgment, jc = $("judgmentCard");
  if (!j.available) {
    jc.className = "card s12 empty"; jc.textContent = "no data yet";
  } else {
    jc.appendChild(el("div", "label", "The judgment"));
    const head = el("div");
    head.appendChild(el("span", "pill " + (VP[j.verdict] || "abstain"), j.verdict));
    head.appendChild(el("span", "mono muted",
      `  conf ${(j.confidence ?? 0).toFixed(2)} · ${j.trigger} · ${fmtTs(j.ts)}`));
    jc.appendChild(head);
    if (j.abstention) {
      const ab = el("div", "mono amber", `ABSTAIN(${j.abstention.reason}): ${j.abstention.detail}`);
      ab.style.cssText = "margin-top:10px;font-size:13px"; jc.appendChild(ab);
    }
    if (j.both_sides) {
      const t = el("div", "triptych");
      [["bull", "green"], ["base", ""], ["bear", "red"]].forEach(([k, cls]) => {
        const sd = el("div", "side " + k);
        sd.appendChild(el("h4", cls, k.toUpperCase()));
        sd.appendChild(el("div", "", j.both_sides[k] || "—"));
        t.appendChild(sd);
      });
      jc.appendChild(t);
    }
    (j.invalidators || []).forEach(x => jc.appendChild(el("div", "chiplet", x)));
    jc.appendChild(el("div", "prooofline",
      `packet_as_of ${fmtTs(j.packet_as_of)} · max_data_ts ${fmtTs(j.packet_max_data_ts)} · ` +
      `spend to date $${d.spend.total_usd.toFixed(2)} / $${d.spend.cap_usd.toFixed(2)}`));
  }

  $("foot").textContent =
    `generated ${fmtTs(d.generated_at)} · shadow soak; no live fills; ` +
    `intraday equity/futures lane — NOT the FX carry edge · specs 023-030 · `;
  const link = el("a", "", "ceyre-boop/passing-funded-account-1-");
  link.href = "https://github.com/ceyre-boop/passing-funded-account-1-";
  $("foot").appendChild(link);
}

fetch("./data.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => { $("err").style.display = "block"; });
</script>
</body>
</html>
