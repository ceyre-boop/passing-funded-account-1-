# Firm contracts for the carry buy gate — spec 021, section P2.
# Parameters transcribed from official rules pages on rules_asof date.
# RE-VERIFY against the live page on the day of any purchase — firms change rules.
# Schema is pre-registered in specs/021_CARRY_BUY_GATE.md; changing a value after
# evaluator output exists requires a logged decision.

cti_1step:
  display_name: "City Traders Imperium 1-Step"
  account_size: 100000.0
  phases:
    - target_pct: 0.08
      min_trading_days: 0
      max_days: null          # no deadline
  max_dd: {type: trailing, pct: 0.05, basis: balance, mark: close}
  daily_dd: null              # CTI 1-Step has NO daily loss limit
  permissions: {weekend_hold: true, overnight_hold: true, news_hold: true}
  costs:
    fee_usd: 382.0
    refund_on_pass: 0.0
    swap_haircut_r_per_day: 0.004
  rules_asof: "2026-08-12"
  source_url: "https://citytradersimperium.com/1-step-challenge/"

