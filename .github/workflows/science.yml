name: science loop

# Runs the deterministic science whether or not any laptop is awake.
# Deliberately does NOT: call a model, spend money, touch a sealed artifact,
# re-pin a checkpoint, or trade. Those need a human, a market, or both.
on:
  schedule:
    - cron: "20 22 * * 1-5"     # 22:20 UTC weekdays — after the US close
  workflow_dispatch: {}          # and on demand

permissions:
  contents: write

concurrency:
  group: science-loop            # never two writers on a hash-chained log
  cancel-in-progress: false

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        # the repo pins what it imports; guessing a package list is how the
        # first cloud run died on a missing pyyaml
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet pytest scikit-learn pydantic

      - name: regression suite must pass before any science is believed
        run: python3 -m pytest -q

      - name: secret reachability (never prints the value)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "${FRED_API_KEY:-}" ]; then
            echo "FRED_API_KEY reachable, length ${#FRED_API_KEY}"
          else
            echo "FRED_API_KEY NOT reachable in this job"
          fi

      - name: run the science loop
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 daytrade/science_loop.py | tee /tmp/science.txt

      - name: publish what moved
        run: |
          git config user.name  "science-loop"
          git config user.email "science-loop@users.noreply.github.com"
          # ONLY the paths this loop writes. `git add data/` swept up files
          # the laptop owns — operator records, the decision ledger, the spend
          # log — and CI and the local tree would fight over hash-chained
          # files at the worst possible moment.
          git add \
            data/carry/fx_state.jsonl \
            data/carry/rates \
            data/carry/bars \
            data/daytrade/science_log.jsonl \
            data/daytrade/carry_reconcile.json \
            data/daytrade/exit_quality.json \
            data/daytrade/ontology_audit.json \
            data/daytrade/stack_exam.json \
            data/daytrade/wrapper_anomaly.json || true
          if git diff --cached --quiet; then
            echo "nothing moved — no commit"
            exit 0
          fi
          MOVED=$(sed -n '/WHAT MOVED/,/^$/p' /tmp/science.txt | head -12)
          git commit -m "science loop $(date -u +%F): $(echo "$MOVED" | head -1)

          $MOVED"
          # another writer (the local dashboard job) may have pushed meanwhile
          git pull --rebase origin main || { echo "rebase conflict — not forcing"; exit 1; }
          git push origin main

      - name: summary
        if: always()
        run: |
          {
            echo '## science loop'
            echo '```'
            tail -30 /tmp/science.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
